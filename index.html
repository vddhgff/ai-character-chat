<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Character Chat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loadingOverlay">
    <div id="loadingText">Loading AI Character Chat…</div>
  </div>
  <div id="app" hidden>
    <aside id="sidebar">
      <div class="sidebar-head">
        <h2>Characters</h2>
        <button class="icon-btn" id="newCharacterBtn" title="New character">+</button>
      </div>
      <input id="characterSearchInput" class="input" placeholder="Search characters…">
      <div id="characterList" class="side-list"></div>
      <div class="sidebar-head" style="margin-top:12px;">
        <h2>Chats</h2>
        <button class="icon-btn" id="newChatBtn" title="New chat">+</button>
      </div>
      <div id="threadList" class="side-list"></div>
      <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border);">
        <button id="userChipBtn" class="side-row" style="width:100%;background:transparent;border:none;text-align:left;">
          <span id="userChipAvatar" class="avatar" style="width:32px;height:32px;"></span>
          <span class="side-row-text">
            <b id="userChipName">You</b>
            <span id="userChipDesc">tap to edit</span>
          </span>
        </button>
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn secondary" id="discoverBtn" style="flex:1;">Discover</button>
          <button class="btn secondary" id="settingsBtn" style="flex:1;">Settings</button>
        </div>
      </div>
    </aside>
    <div id="sidebarScrim"></div>
    <main>
      <header id="chatHeader"></header>
      <div id="chatBody">
        <div id="messages"></div>
      </div>
      <div id="composer" hidden></div>
    </main>
  </div>
  <div id="toastRoot"></div>
  <div id="modalRoot"></div>
  <script type="module" src="js/boot.js"></script>
</body>
</html>
