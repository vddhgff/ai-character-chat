<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Character Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/perchance-original.css">
  <link rel="stylesheet" href="css/perchance-layout.css">
</head>
<body>
  <div id="loadingOverlay"><div id="loadingText">Loading AI Character Chat…</div></div>
  <div id="app" hidden>
    <aside id="sidebar">
      <div class="reference-new-row">
        <button id="newChatBtn">💬 new chat / character</button>
        <button data-action="toggle-sidebar" aria-label="Menu">☰</button>
      </div>
      <div id="threadSearchCtn" hidden><input id="threadSearchInput" placeholder="search threads..." aria-label="Search thread titles and previews"><button data-action="search-threads" title="Search threads">🔎</button></div>
      <div id="threadList" class="side-list"></div>
      <div id="appOptions">
        <div class="reference-option-row">
          <button id="settingsBtn">⚙️ settings</button>
          <button class="fit" data-action="tips">❓ tips</button>
          <button class="fit" data-action="fullscreen" title="Fullscreen">⇱</button>
        </div>
        <div class="reference-option-row">
          <button class="wipe" data-action="wipe-data" title="Delete local data">🗑️</button>
          <button data-action="export-data">💾 export</button>
          <button data-action="import-data">📁 import</button>
        </div>
        <div class="reference-option-row">
          <button class="fit" disabled title="Perchance-hosted public feedback is not connected to this GitHub Pages app.">📝 feedback</button>
          <button disabled title="Perchance-hosted community comments are not connected to this GitHub Pages app.">🙋 comments</button>
        </div>
      </div>
      <div hidden>
        <input id="characterSearchInput"><div id="characterList"></div>
        <button id="newCharacterBtn">New character</button><button id="discoverBtn">Characters</button>
        <button id="userChipBtn"><span id="userChipAvatar"></span><b id="userChipName">You</b><span id="userChipDesc"></span></button>
      </div>
    </aside>
    <div id="sidebarScrim"></div>
    <main>
      <header id="chatHeader"></header>
      <div id="chatBody"><div id="messages"></div></div>
      <div id="composer" hidden></div>
    </main>
  </div>
  <div id="toastRoot"></div><div id="modalRoot"></div>
  <script type="module" src="js/boot.js"></script>
</body>
</html>
